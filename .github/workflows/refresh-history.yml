name: Refresh lottery history and publish
on:
  schedule:
    - cron: '30 12,14 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-history.mjs
      - .github/workflows/refresh-history.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: lottery-refresh
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect and validate the latest 24 draws
        run: node scripts/update-history.mjs .
      - name: Save validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html history.json backtest-history.json '*-last24.csv'
          if ! git diff --cached --quiet; then
            git commit -m "Refresh lottery history"
            git push
          fi
      - name: Request branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url=process.env.GITHUB_API_URL+'/repos/'+process.env.GITHUB_REPOSITORY+'/pages/builds';
          const r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
          if(!r.ok)throw new Error('Pages build request failed: '+r.status+' '+await r.text());
          console.log('Pages build requested successfully');
          NODE
